name: framework-guard

# 两道防线，防的是同一件事：把组委会的评测框架改坏了却没人发现。
# 后果不是「测试失败」，而是评测时 exit 4 —— 一次提交机会直接作废。
#
#   1. integrity    ：跑组委会自带的 integrity.py --verify（逐文件 SHA256）
#   2. baseline-diff：与 baseline-package 标签逐文件比对**内容哈希**
#                     —— 额外防住「改了 core/ 之后顺手重跑 --generate 刷哈希」这条路
#
# ⚠️ 路径必须写**字面目录名**，不能用 'participant/*/core' 这类 glob：
#    git 的 glob pathspec 是对完整文件路径做 fnmatch，'participant/x/core/文件.py'
#    匹配不上 'participant/*/core'，会静默匹配到 0 个文件 → 防线形同虚设还显示 PASS。
#    而字面目录 pathspec 会自动递归。

on:
  push:
  pull_request:
  workflow_dispatch:        # 网页上手动触发：Actions → framework-guard → Run workflow
                            # 用途：改了本地环境 / 拉过别人分支后，一键复核仓库仍健康

permissions:
  contents: read

jobs:
  integrity:
    name: 框架 SHA256 完整性
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 逐任务执行 integrity.py --verify
        run: |
          set -uo pipefail
          fail=0
          for t in pingpang basketball; do
            echo "::group::$t"
            if PYTHONPATH="participant/$t" python3 "participant/$t/integrity.py" --verify; then
              echo "✅ $t 完整性校验通过"
            else
              echo "::error title=$t 完整性校验失败::$t 的受保护文件与 .integrity.json 不一致，评测会 exit 4"
              fail=1
            fi
            echo "::endgroup::"
          done
          exit $fail

      - name: 按 manifest 核对验证集是否齐全
        run: |
          python3 tools/check_dataset.py participant
          # integrity.py 覆盖不到 public_data/，这一步必须单独做：
          # 中文文件名在 Windows 下解压时会被静默丢弃，而完整性校验照样通过。

  baseline-diff:
    name: 与 baseline-package 基线比对
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0        # 需要连同 baseline-package 标签一起取下来

      - name: 逐文件比对受保护内容哈希
        run: |
          set -uo pipefail
          BASE="$(git rev-list -n1 baseline-package 2>/dev/null || true)"
          if [ -z "$BASE" ]; then
            echo "::warning title=缺少基线标签::本仓库找不到 baseline-package 标签，跳过比对。请确认标签已 push（git push origin baseline-package）。"
            exit 0
          fi
          echo "基线 commit: $BASE"

          # 受保护范围 = participant/<task>/integrity.py 的 PROTECTED
          # （core/**.py + scripts/**.py + run.py/run.sh/validate.py/integrity.py）
          # 再加上 .integrity.json 自身（挡住「刷哈希」）和框架级入口 run_all.sh、说明文档。
          # 一律用字面路径，不用 glob（原因见文件头）。
          PROTECTED=(
            participant/run_all.sh
            participant/README.md
            participant/pingpang/core
            participant/pingpang/scripts
            participant/pingpang/run.py
            participant/pingpang/run.sh
            participant/pingpang/validate.py
            participant/pingpang/integrity.py
            participant/pingpang/.integrity.json
            participant/basketball/core
            participant/basketball/scripts
            participant/basketball/run.py
            participant/basketball/run.sh
            participant/basketball/validate.py
            participant/basketball/integrity.py
            participant/basketball/.integrity.json
          )

          # 两个 ref 的文件清单都取，这样「新增一个 core/xxx.py」也会被发现。
          files="$( { git ls-tree -r --name-only "$BASE" -- "${PROTECTED[@]}"
                      git ls-tree -r --name-only HEAD   -- "${PROTECTED[@]}"; } | sort -u )"
          echo "受保护文件数: $(printf '%s\n' "$files" | grep -c .)"

          # 比对 blob 哈希而不是 git diff：只认内容，不把文件权限位变化算成篡改
          # （组委会的契约是 SHA256，权限位不影响校验结果）。
          bad=0
          while IFS= read -r f; do
            [ -z "$f" ] && continue
            a="$(git rev-parse --quiet --verify "$BASE:$f" 2>/dev/null || echo '-')"
            b="$(git rev-parse --quiet --verify "HEAD:$f"  2>/dev/null || echo '-')"
            if [ "$a" != "$b" ]; then
              echo "  ✗ $f"
              bad=$((bad + 1))
            fi
          done <<< "$files"

          if [ "$bad" -ne 0 ]; then
            echo "::error title=受保护文件被改动::$bad 个文件的内容相对 baseline-package 变了，评测会判完整性失败（exit 4）。只能改 participant/<task>/participant/ 里的东西。"
            echo "还原：git checkout baseline-package -- <文件>"
            exit 1
          fi
          echo "✅ 受保护文件内容与 baseline-package 逐字节一致"
